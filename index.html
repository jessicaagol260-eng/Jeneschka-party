<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation Anniversaire</title>
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-snap-type: y mandatory; }
body { margin: 0; background: #050505; color: #f8f1df; font-family: Georgia, serif; overflow-x: hidden; }

/* Sections full-screen avec Snap Scroll */
section {
  height: 100vh; height: 100svh;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; scroll-snap-align: start;
}

/* Image d'arrière-plan */
.bg {
  position: absolute; inset: 0;
  background-image: url('IMG_3331.jpeg');
  background-size: 300% 300%;
  transform: scale(1.03); transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}
section.visible .bg { transform: scale(1); }

.overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.5)); }

.content { position: relative; z-index: 2; text-align: center; padding: 20px; width: 100%; max-width: 480px; }

/* Animation & Style de l'Enveloppe */
.envelope-container {
  position: relative; width: min(80vw, 320px); height: 200px;
  margin: 30px auto 20px; cursor: pointer; perspective: 1000px;
}
.envelope { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s ease; }
.env-body { position: absolute; inset: 0; border: 1px solid #c59b27; border-radius: 8px; background: linear-gradient(145deg, #1c1a17, #080808); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
.flap {
  position: absolute; top: 0; left: 0; right: 0; height: 100px; background: #221f1a;
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top; transition: transform 0.6s ease 0.2s, z-index 0.2s;
  z-index: 3; border-top: 1px solid #c59b27;
}
.seal {
  position: absolute; top: 75px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px;
  border-radius: 50%; background: radial-gradient(circle, #e5be65, #996e1e); color: #111;
  display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 4; transition: opacity 0.4s ease, transform 0.4s ease;
}
.envelope-container.open .flap { transform: rotateX(180deg); z-index: 1; }
.envelope-container.open .seal { opacity: 0; transform: translateX(-50%) scale(0.5); }

/* Boutons */
.btn {
  display: inline-block; color: #f1d388; border: 1px solid #c59b27; background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(5px); border-radius: 30px; padding: 12px 28px; text-decoration: none;
  letter-spacing: 0.15em; text-transform: uppercase; font-size: 11px; cursor: pointer;
  transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.btn:hover { background: #c59b27; color: #000; }

.scroll {
  position: absolute; bottom: 25px; z-index: 3; color: #e0b65b; font-size: 10px;
  letter-spacing: 0.2em; text-transform: uppercase; animation: bob 1.8s infinite; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
</style>
</head>
<body>

<!-- Element audio personnalisé -->
<audio id="bgMusic" src="Copy_74F466DB-694A-4482-8035-ED20F8B0A929-192kbps.mp3" loop></audio>

<main id="app"></main>

<script>
// Positions de la grille 3x3
const gridPositions = [
  "0% 0%",   "50% 0%",   "100% 0%",
  "0% 50%",  "50% 50%",  "100% 50%",
  "0% 100%", "50% 100%", "100% 100%"
];

const app = document.getElementById('app');

gridPositions.forEach((pos, index) => {
  const id = index + 1;
  const section = document.createElement('section');
  if (id === 1) section.classList.add('visible');

  let innerHTML = '';
  if (id === 1) {
    innerHTML = `
      <div class="content">
        <div class="envelope-container" id="envelopeContainer" onclick="openInvite()">
          <div class="envelope">
            <div class="env-body"></div>
            <div class="flap"></div>
            <div class="seal">M</div>
          </div>
        </div>
        <button class="btn" onclick="openInvite()">Ouvre-moi</button>
      </div>`;
  } else if (id === 5) {
    innerHTML = `
      <div class="content" style="margin-top: 120px;">
        <a href="https://maps.google.com/?q=Restaurant+Le+Coq+Noir+92+boulevard+Victor+Hugo+92110+Clichy" target="_blank" class="btn">📍 Voir l'itinéraire</a>
      </div>`;
  } else if (id === 9) {
    innerHTML = `
      <div class="content">
        <a href="mailto:contact@julieadawa.com?subject=Confirmation%20Presence%20Anniversaire" class="btn">Confirmer ma présence</a>
      </div>`;
  }

  const scrollIndicator = id < 9 ? '<div class="scroll">∨ scrollez-moi ∨</div>' : '';

  section.innerHTML = `
    <div class="bg" style="background-position: ${pos};"></div>
    <div class="overlay"></div>
    ${innerHTML}
    ${scrollIndicator}
  `;

  app.appendChild(section);
});

function openInvite() {
  const music = document.getElementById('bgMusic');
  if (music) music.play().catch(() => {});

  const container = document.getElementById('envelopeContainer');
  if (container) container.classList.add('open');

  setTimeout(() => {
    document.querySelectorAll('section')[1].scrollIntoView({ behavior: 'smooth' });
  }, 700);
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.4 });

document.querySelectorAll('section').forEach(sec => observer.observe(sec));
</script>

</body>
</html>
