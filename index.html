<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation - Julie Adawa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0b0b;
            color: #f0e6d2;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card-container {
            background: #141414;
            border: 1px solid #d4af37;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* Carrousel à défilement horizontal sans doublon */
        .carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .carousel img {
            width: 100%;
            flex-shrink: 0;
            scroll-snap-align: center;
            border-radius: 8px;
        }

        .audio-card {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 12px;
        }

        audio {
            width: 100%;
            filter: invert(0.9) hue-rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Carrousel avec les visuels uniques -->
        <div class="carousel">
            <img src="page1.jpg" alt="Ouverture">
            <img src="page2.jpg" alt="Invitation Julie Adawa">
            <img src="page3.jpg" alt="Dress Code">
            <img src="page4.jpg" alt="Date et Lieu">
            <img src="page5.jpg" alt="Remerciements">
        </div>

        <!-- Lecteur Audio -->
        <div class="audio-card">
            <audio controls autoplay loop>
                <source src="Son birthday 2.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

</body>
</html>
